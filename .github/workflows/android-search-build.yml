name: Aura AI Android APK Build
on:
  push:
    branches: ['brain/phase-3-android-search']
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android-search-build.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
      AURA_STORE_PASSWORD: ${{ secrets.AURA_STORE_PASSWORD }}
      AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
      AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check whether persistent release signing is configured
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${AURA_KEYSTORE_BASE64:-}" &&
                -n "${AURA_STORE_PASSWORD:-}" &&
                -n "${AURA_KEY_ALIAS:-}" &&
                -n "${AURA_KEY_PASSWORD:-}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Persistent signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are incomplete. Building a debug test APK only; no GitHub release will be published."
          fi

      - name: Decode persistent signing key
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$AURA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aura-release.jks"
          test -s "$RUNNER_TEMP/aura-release.jks"
          echo "AURA_STORE_FILE=$RUNNER_TEMP/aura-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon -PbuildNumber=${{ github.run_number }} assembleRelease

      - name: Verify release APK signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          mkdir -p app/build/outputs/apk
          cp "$APK" app/build/outputs/apk/Aura-AI.apk

      - name: Build debug test APK when release signing is unavailable
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon assembleDebug

      - name: Prepare clearly labeled unsigned-for-release test artifact
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p app/build/outputs/apk
          cp "$APK" app/build/outputs/apk/Aura-AI-DEBUG-TEST-ONLY.apk

      - name: Upload debug test artifact (not a release)
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AI-DEBUG-TEST-ONLY
          path: app/build/outputs/apk/Aura-AI-DEBUG-TEST-ONLY.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AI-APK
          path: app/build/outputs/apk/Aura-AI.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed APK release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aura-build-${{ github.run_number }}
          name: Aura AI signed APK build ${{ github.run_number }}
          body: |
            Signed APK built from the development branch.
            Package ID: ai.harika.jarvis
            The workflow verifies the APK signature before publishing.
            This is a development prerelease, not a stable release.
            Install over an existing app only after verifying that its signing certificate matches.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/Aura-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
