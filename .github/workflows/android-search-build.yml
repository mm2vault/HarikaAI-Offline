name: Aura AI Android APK Build
on:
  push:
    branches: ['brain/phase-3-android-search']
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android-search-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK for direct download
        run: cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/Aura-AI-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AI-APK
          path: app/build/outputs/apk/debug/Aura-AI-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aura-build-${{ github.run_number }}
          name: Aura AI APK build ${{ github.run_number }}
          body: Automated debug APK build from the development branch. Not merged into main.
          prerelease: true
          files: app/build/outputs/apk/debug/Aura-AI-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
