name: Aura AI - Build and Verify
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - brain/aura-rebuild-clean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK identity and visible branding
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='ai.harika.jarvis'"
          echo "$BADGING" | grep -F "application-label:'Aura AI'"
          EXPECTED_VERSION_NAME="$(grep '^AURA_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          EXPECTED_VERSION_CODE="$(grep '^AURA_VERSION_CODE=' gradle.properties | cut -d= -f2-)"
          echo "$BADGING" | grep -F "versionName='$EXPECTED_VERSION_NAME'"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
          echo "APK package, app label, versionName and versionCode checks passed."
      - name: Upload test APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-debug-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
