name: JARVİS Brain Transformer Tests
on:
  push:
    branches: ['brain/**']
    paths: ['brain/python/**', '.github/workflows/brain-transformer-tests.yml']
  pull_request:
    paths: ['brain/python/**', '.github/workflows/brain-transformer-tests.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r brain/python/requirements-transformer.txt
      - run: PYTHONPATH=brain/python python -m unittest brain/python/tests/test_transformer.py -v
      - run: PYTHONPATH=brain/python python -m compileall -q brain/python
