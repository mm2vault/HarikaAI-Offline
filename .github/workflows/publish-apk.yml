name: Aura AI - Publish APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 0.1.1 (do not include v)"
        required: true
        type: string
      release_notes:
        description: "Short notes about this test build"
        required: false
        default: "Aura AI Android test build. Device testing and update-signature compatibility are not guaranteed."
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch or ref
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK identity and visible branding
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='ai.harika.jarvis'"
          echo "$BADGING" | grep -F "application-label:'Aura AI'"

      - name: Publish APK as a clearly marked prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aura-v${{ inputs.version }}
          name: Aura AI ${{ inputs.version }} (Test)
          body: |
            ${{ inputs.release_notes }}

            **This is a test/prerelease APK, not a stable production release.**
            The APK is built with the debug signing configuration. Installing over an existing copy depends on signing-certificate compatibility. Test on a separate device/profile first.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
